# ============================================================
# Nginx Configuration — Frontend
# ============================================================
# WHAT IS NGINX?
# Nginx (pronounced "engine-x") is a super fast web server.
# In production, we DON'T use Vite's dev server. Instead,
# we run "npm run build" to create static HTML/JS/CSS files,
# then Nginx serves those files blazingly fast.
#
# WHY NOT VITE IN PRODUCTION?
# Vite's dev server has hot-reload, source maps, etc. — great
# for development but slow and insecure for production. Nginx
# is built to handle thousands of requests efficiently.
# ============================================================

server {
    # Listen on port 80 (standard HTTP port)
    listen 80;
    server_name _;

    # Where the built React files live inside the container
    root /usr/share/nginx/html;
    index index.html;

    # ---------- Gzip Compression ----------
    # Compresses files before sending to the browser.
    # A 500KB JS file might become 150KB = faster page load.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ---------- SPA Fallback ----------
    # React Router uses client-side routing (e.g., /room/abc123).
    # If someone refreshes on /room/abc123, Nginx would normally
    # look for a file called "room/abc123" and return 404.
    # This rule says: "If the file doesn't exist, serve index.html
    # and let React Router handle it."
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- Cache Static Assets ----------
    # Tell browsers to cache JS/CSS/images for 1 year.
    # Vite adds a hash to filenames (e.g., app-abc123.js),
    # so when you deploy a new version, the filename changes
    # and browsers automatically download the new file.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
