# ============================================================
# Prometheus RBAC — Permissions to Read Cluster Data
# ============================================================
# WHAT IS RBAC?
# Role-Based Access Control. Kubernetes is secure by default —
# pods can't just read cluster data unless explicitly allowed.
# Prometheus needs permission to list pods, nodes, and services
# to auto-discover scrape targets.
#
# We create:
#   1. ServiceAccount   — an identity for the Prometheus pod
#   2. ClusterRole      — what it's allowed to do (read-only)
#   3. ClusterRoleBinding — links the account to the role
# ============================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: naqsh

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: naqsh
