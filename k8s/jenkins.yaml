# ============================================================
# Jenkins — CI/CD Server
# ============================================================
# WHAT IS JENKINS?
# Jenkins is an automation server. Every time you push code
# to GitHub, Jenkins:
#   1. Builds your Docker images
#   2. Pushes them to Docker Hub
#   3. Tells Kubernetes to do a rolling update (zero downtime)
#
# It runs INSIDE your cluster so it can talk to kubectl directly.
#
# ACCESS: http://YOUR_IP:30080 → Wait, that's the app.
#         Jenkins is on port 30082 (to avoid conflict)
# ============================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: naqsh

---
# Give Jenkins permission to manage deployments in the cluster
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins
rules:
  - apiGroups: ["", "apps", "extensions"]
    resources: ["deployments", "services", "pods", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jenkins
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: naqsh

---
# PersistentVolumeClaim — saves Jenkins data (jobs, plugins, config)
# even if the pod restarts
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-pvc
  namespace: naqsh
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: naqsh
  labels:
    app: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins
      securityContext:
        fsGroup: 1000
        runAsUser: 0   # Jenkins needs root to install plugins
      containers:
        - name: jenkins
          image: jenkins/jenkins:lts-jdk17
          ports:
            - containerPort: 8080   # Web UI
            - containerPort: 50000  # Agent communication
          env:
            - name: JAVA_OPTS
              value: "-Djenkins.install.runSetupWizard=false"
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: jenkins-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-service
  namespace: naqsh
spec:
  type: NodePort
  selector:
    app: jenkins
  ports:
    - name: web
      port: 8080
      targetPort: 8080
      nodePort: 30082   # Access Jenkins at http://IP:30082
    - name: agent
      port: 50000
      targetPort: 50000
      nodePort: 30050
